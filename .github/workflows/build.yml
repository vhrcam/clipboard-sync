name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            file: CopyCat-mac.zip
          - os: windows-latest
            file: CopyCat-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3 pytest

      - name: Test
        run: python -m pytest -q tests

      - name: Build
        run: pyinstaller --noconfirm CopyCat.spec

      - name: Package for Mac
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/CopyCat.app dist/${{ matrix.file }}

      - name: Package for Windows
        if: runner.os == 'Windows'
        run: Move-Item dist/CopyCat.exe dist/${{ matrix.file }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: dist/${{ matrix.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "CopyCat $GITHUB_REF_NAME" --generate-notes
