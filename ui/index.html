<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CopyCat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="cat" viewBox="0 0 120 133">
      <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M38 46 C36 38 37 31 40 26 L41 8 L54 19 Q60 17 66 19 L79 8 L80 26 C83 31 84 38 82 46 C80 58 70 64 60 64 C50 64 40 58 38 46 Z"/>
        <path d="M47 61 C36 72 30 92 32 112 C33 124 40 130 50 130 L70 130 C80 130 87 124 88 112 C90 92 84 72 73 61"/>
        <path d="M51 100 C52 112 52 122 51 130 M69 100 C68 112 68 122 69 130"/>
        <path d="M87 122 C103 127 114 117 109 101 C106 91 110 83 117 81"/>
        <path stroke-width="4" d="M47 52 L31 49 M47 55.5 L32 58 M73 52 L89 49 M73 55.5 L88 58"/>
      </g>
      <g fill="currentColor">
        <path d="M57.5 49.5 L62.5 49.5 L60 52.5 Z"/>
        <ellipse cx="51" cy="41" rx="3" ry="4"/>
        <ellipse cx="69" cy="41" rx="3" ry="4"/>
      </g>
    </symbol>
    <symbol id="icon-laptop" viewBox="0 0 160 106">
      <rect x="27" y="6" width="106" height="74" rx="7" fill="#fff" fill-opacity="0.035" stroke="none"/>
      <rect x="27" y="6" width="106" height="74" rx="7"/>
      <path d="M6 87 H154 C154 94 148 99 141 99 H19 C12 99 6 94 6 87 Z"/>
      <path d="M67 87 Q69 91 73 91 H87 Q91 91 93 87" stroke-width="3" opacity="0.7"/>
    </symbol>
    <symbol id="icon-tower" viewBox="0 0 90 126">
      <rect x="14" y="4" width="62" height="114" rx="8" fill="#fff" fill-opacity="0.035" stroke="none"/>
      <rect x="14" y="4" width="62" height="114" rx="8"/>
      <circle cx="45" cy="22" r="6"/>
      <path d="M27 40 H63 M27 50 H63" stroke-width="3" opacity="0.7"/>
      <path d="M31 80 H59 M31 88 H59 M31 96 H59" stroke-width="3" opacity="0.35"/>
      <path d="M24 122 H34 M56 122 H66"/>
    </symbol>
  </svg>

  <section id="splash" class="splash" aria-label="CopyCat">
    <div class="lockup">
      <h1 class="wordmark" aria-label="CopyCat">
        <span style="--i:0">C</span><span style="--i:1">o</span><span style="--i:2">p</span><span style="--i:3">y</span><span style="--i:4">C</span><span style="--i:5">a</span><span style="--i:6">t</span>
      </h1>
      <svg class="cat" viewBox="0 0 120 133" aria-hidden="true">
        <path class="stroke" pathLength="1" style="--d:1.25s" d="M38 46 C36 38 37 31 40 26 L41 8 L54 19 Q60 17 66 19 L79 8 L80 26 C83 31 84 38 82 46 C80 58 70 64 60 64 C50 64 40 58 38 46 Z"/>
        <path class="stroke" pathLength="1" style="--d:1.45s" d="M47 61 C36 72 30 92 32 112 C33 124 40 130 50 130 L70 130 C80 130 87 124 88 112 C90 92 84 72 73 61"/>
        <path class="stroke" pathLength="1" style="--d:1.75s" d="M51 100 C52 112 52 122 51 130 M69 100 C68 112 68 122 69 130"/>
        <path class="stroke tail" pathLength="1" style="--d:1.85s" d="M87 122 C103 127 114 117 109 101 C106 91 110 83 117 81"/>
        <path class="stroke whisker" pathLength="1" style="--d:2.05s" d="M47 52 L31 49 M47 55.5 L32 58 M73 52 L89 49 M73 55.5 L88 58"/>
        <path class="nose" d="M57.5 49.5 L62.5 49.5 L60 52.5 Z"/>
        <ellipse class="eye" cx="51" cy="41" rx="3" ry="4"/>
        <ellipse class="eye" cx="69" cy="41" rx="3" ry="4"/>
      </svg>
    </div>
    <div class="streak" aria-hidden="true"></div>
    <p class="tagline">Copy here · Paste there</p>
  </section>

  <main id="home" class="home">
    <header class="topbar">
      <svg class="mini-cat" aria-hidden="true"><use href="#cat"/></svg>
      <span>CopyCat</span>
    </header>

    <div class="stage">
      <figure class="device" id="self" data-os="mac" data-state="idle">
        <div class="art">
          <svg class="icon laptop" aria-hidden="true"><use href="#icon-laptop"/></svg>
          <svg class="icon tower" aria-hidden="true"><use href="#icon-tower"/></svg>
        </div>
        <figcaption>
          <span class="name"></span>
          <span class="status" data-state="idle">
            <span class="dots"><i></i><i></i><i></i></span>
            <span class="spinner"></span>
            <svg class="check" viewBox="0 0 28 28"><circle cx="14" cy="14" r="13"/><path pathLength="1" d="M8.5 14.5 L12.3 18.2 L19.8 10.2"/></svg>
          </span>
        </figcaption>
      </figure>

      <div class="wire" id="wire" data-state="idle" aria-hidden="true"><span class="packet"></span></div>

      <figure class="device" id="peer" data-os="windows" data-state="idle">
        <div class="art">
          <svg class="icon laptop" aria-hidden="true"><use href="#icon-laptop"/></svg>
          <svg class="icon tower" aria-hidden="true"><use href="#icon-tower"/></svg>
        </div>
        <figcaption>
          <span class="name"></span>
          <span class="status" data-state="idle">
            <span class="dots"><i></i><i></i><i></i></span>
            <span class="spinner"></span>
            <svg class="check" viewBox="0 0 28 28"><circle cx="14" cy="14" r="13"/><path pathLength="1" d="M8.5 14.5 L12.3 18.2 L19.8 10.2"/></svg>
          </span>
        </figcaption>
      </figure>
    </div>

    <div class="bottom">
      <p class="message" id="message" aria-live="polite"></p>
      <div class="pairing" id="pairing" hidden>
        <p class="pairing-title">Pair with <span id="pair-name"></span>?</p>
        <p class="pairing-hint">Check that this code matches on both computers.</p>
        <p class="code" id="pair-code"></p>
        <div class="actions" id="pair-actions">
          <button class="btn ghost" id="pair-no" type="button">Not now</button>
          <button class="btn primary" id="pair-yes" type="button">Pair</button>
        </div>
        <p class="pairing-wait" id="pair-wait" hidden>Waiting for the other computer…</p>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-left">
        <span id="self-ip"></span>
        <span class="sep">·</span>
        <button class="link" id="show-connect" type="button">Connect by IP</button>
        <form class="connect" id="connect-form" hidden>
          <input id="connect-input" placeholder="Other computer's IP" autocomplete="off" spellcheck="false" aria-label="Other computer's IP address">
          <button class="btn small" type="submit">Connect</button>
        </form>
      </div>
      <button class="link" id="unpair" type="button" hidden>Unpair</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
